# Sternfresser – Start mit: docker compose up -d --build
# Anleitung: ANLEITUNG-DOCKER.md
services:
  sternfresser:
    build: .
    image: sternfresser:latest
    container_name: sternfresser
    restart: unless-stopped
    environment:
      - PORT=3000
      - BASE_PATH=/Sternfresser
      - MAX_ROOMS=40
    ports:
      # nur lokal erreichbar, der Reverse-Proxy (nginx/Caddy) leitet /Sternfresser hierher
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
